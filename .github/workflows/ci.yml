name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository; a token that can only read limits
# what a compromised action or dependency could do with it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --locked

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # rust-toolchain.toml says "stable", and a toolchain file beats the
      # `rustup default` the action sets, so without this the job quietly
      # checked on stable. RUSTUP_TOOLCHAIN beats the file.
      RUSTUP_TOOLCHAIN: "1.89.0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - name: Fail unless this is the declared MSRV
        run: |
          msrv=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
          rustc --version
          rustc --version | grep -q "^rustc ${msrv}\(\.0\)\? " \
            || { echo "expected rustc $msrv (Cargo.toml rust-version)" >&2; exit 1; }
      - run: cargo check --all-targets --locked

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  container:
    name: container image (amd64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build both platforms the way a release does, without pushing, so a
      # broken Dockerfile shows up on the pull request and not on release day.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The amd64 image runs
        run: |
          docker buildx build --load --platform linux/amd64 -t kscope:ci --cache-from type=gha .
          docker run --rm kscope:ci --version

  e2e:
    name: end-to-end against kind
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: helm/kind-action@v1
      - name: Install metrics-server
        run: |
          # A fixed release: "latest" let an upstream release break every
          # pull request at once, with nothing in this repository changed.
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.7.2/components.yaml
          kubectl patch -n kube-system deployment metrics-server --type=json \
            -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl -n kube-system rollout status deployment/metrics-server --timeout=180s
      - name: Produce a pod with logs
        run: |
          kubectl run noisy --image=busybox --restart=Never -- \
            sh -c 'for i in $(seq 1 200); do echo "INFO line $i"; echo "ERROR failure $i"; done; sleep 3600'
          kubectl wait --for=condition=Ready pod/noisy --timeout=120s
      - name: Non-interactive dump must return the lines
        run: |
          cargo run --locked -- --dump noisy | tee /tmp/out.log
          grep -q "ERROR failure 200" /tmp/out.log
      - name: Fleet search must find the pod and name its context
        run: |
          cargo run --locked -- --fleet 'kind-*' --find noisy | tee /tmp/find.txt
          grep -Eq '^kind-[^ ]+ +default +noisy ' /tmp/find.txt
          ! cargo run --locked -- --fleet 'kind-*' --find no-such-pod
      - name: kubectl-style get across a fleet by plain word
        run: |
          cargo run --locked -- get pods noisy -u kind | tee /tmp/get.txt
          grep -Eq '^kind-[^ ]+ +default +noisy ' /tmp/get.txt

