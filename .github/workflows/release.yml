name: Release

on:
  push:
    # Both "v1.2.3" and bare "1.2.3" — the project tags without the prefix.
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # One job writes the release page, from the CHANGELOG section for this tag.
  # The build jobs only attach files: when each of them generated notes, the
  # page ended up as five copies of a bare "Full Changelog" link.
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extract this version's changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/        { exit }
            on                    { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat >> notes.md <<EOF

          ## Install

          \`\`\`sh
          # Linux x86_64; see the assets below for macOS, Windows and arm64
          curl -sSfL https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/kscope-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo install kscope /usr/local/bin/
          \`\`\`

          Every archive has a \`.sha256\` next to it. The container image is
          \`ghcr.io/${GITHUB_REPOSITORY}:${version}\`.
          EOF
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md

  build:
    name: build ${{ matrix.target }}
    needs: notes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu }
          - { os: macos-latest,   target: x86_64-apple-darwin }
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          archive=kscope-${{ matrix.target }}.tar.gz
          tar -C target/${{ matrix.target }}/release -czf "$archive" kscope
          shasum -a 256 "$archive" > "$archive.sha256"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "kscope-${{ matrix.target }}.zip"
          Compress-Archive target/${{ matrix.target }}/release/kscope.exe $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii -NoNewline "$archive.sha256"
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            kscope-${{ matrix.target }}.tar.gz
            kscope-${{ matrix.target }}.tar.gz.sha256
            kscope-${{ matrix.target }}.zip
            kscope-${{ matrix.target }}.zip.sha256

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
      # No QEMU: the Dockerfile cross-compiles arm64 on the amd64 runner.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
