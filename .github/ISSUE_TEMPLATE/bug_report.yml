name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact steps to reproduce it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: kscope version
      placeholder: "kscope 0.1.0"
    validations:
      required: true
  - type: input
    id: k8s
    attributes:
      label: Kubernetes version and distribution
      placeholder: "v1.30.2, GKE"
  - type: input
    id: terminal
    attributes:
      label: Terminal and OS
      placeholder: "kitty 0.35 on Fedora 40"
  - type: textarea
    id: logs
    attributes:
      label: Diagnostic output
      description: Output of `KSCOPE_LOG=debug kscope --log-file /tmp/kscope.log`
      render: shell
