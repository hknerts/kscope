# kscope configuration
# Copy to ~/.config/kscope/config.toml (Linux) or
# ~/Library/Application Support/io.kscope.kscope/config.toml (macOS).
# Every key is optional; anything omitted keeps its default.

[general]
# Redraw cap. Lower this on slow terminals or over SSH.
max_fps = 30
# Namespace used on start-up. Omit to follow the kubeconfig context.
# namespace = "payments"
# Pods, nodes and events are watched, so changes show up immediately; this
# is how often the browsed list is re-listed and idle snapshots re-sent.
inventory_refresh_ms = 5000
# Capture the mouse for wheel scrolling on start-up. M toggles it at runtime:
# off, the terminal selects and copies text as usual.
mouse = true

[describe]
# Secret values are shown as "<redacted, N bytes>". Set to true to see them.
show_secret_values = false
# `v` on a Secret's describe shows its values decoded. Set to false to hand
# kscope to people who must never see them, even on demand.
allow_reveal = true

[fleets]
# Named sets of kubeconfig contexts, listed as one (globs: * and ?). They show
# up in the fleets box above the contexts; `kscope --fleet stg` starts on one.
# Built in: stg = ["*stg*", "*staging*"] and prod = ["*prod*", "*prd*", "*pro*"].
# An entry here replaces the built-in of the same name; [] switches it off.
# KSCOPE_FLEET_<NAME>="glob,glob" in the environment wins over this file.
# stg = ["kind-stg-*"]
# qa = ["qa-*"]

[logs]
# Lines kept in memory. 0 (the default) means unlimited: nothing is ever
# evicted, so you can always scroll back to the first line of the session.
# Set a positive value to turn this into a ring buffer with a memory ceiling.
buffer_lines = 0
# History requested when attaching. 0 (the default) means everything the API
# server still has, i.e. from the moment the container started.
tail_lines = 0
# Only fetch lines from the last N seconds. Omit for no limit.
# since_seconds = 3600
# Ask the API server for RFC3339 timestamps.
timestamps = false
follow = true
wrap = false
# Searches are case-insensitive unless the query contains an upper-case letter.
smart_case = true
# Where `s` saves the visible buffer (kscope-YYYYMMDD-HHMMSS.log). Omit for
# the platform data directory: ~/.local/share/kscope (Linux),
# ~/Library/Application Support/io.kscope.kscope (macOS),
# %APPDATA%\kscope\kscope\data (Windows). Never the working directory unless
# set to it. `~/` is the home directory; created when missing.
# save_dir = "~/kscope-logs"

[metrics]
refresh_ms = 5000
# Samples retained per series; also the maximum sparkline width.
history = 240
warn_pct = 75.0
critical_pct = 90.0

[theme]
# Names ("red", "lightcyan", "darkgray") or hex ("#ff8800").
fg = "gray"
accent = "cyan"
border = "darkgray"
border_focus = "cyan"
error = "red"
warn = "yellow"
info = "green"
debug = "blue"
trace = "darkgray"
match_fg = "black"
match_bg = "yellow"

# Extra regex highlight rules, applied on top of the built-in ones.
[[highlight]]
pattern = 'trace_id=[a-f0-9]{16,32}'
fg = "magenta"

[[highlight]]
pattern = 'order_id=[0-9]+'
fg = "#ff8800"
bold = true

[[highlight]]
pattern = '\b(OOMKilled|CrashLoopBackOff|Evicted)\b'
fg = "red"
bold = true
